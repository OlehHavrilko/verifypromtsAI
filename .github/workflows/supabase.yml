name: Deploy Supabase backend

# Manual only: pushing database migrations and edge functions is a deliberate
# action. Requires repo secrets:
#   SUPABASE_ACCESS_TOKEN  — https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   — project reference, e.g. abcdefghijklmnop
#   SUPABASE_DB_PASSWORD   — database password
# Edge-function secrets (AI_API_KEY, AI_MODEL, APP_SITE_URL, STRIPE_*) are set
# once with `supabase secrets set` — see SETUP.md.

on:
  workflow_dispatch:
    inputs:
      push_migrations:
        description: Apply database migrations (supabase db push)
        type: boolean
        default: true
      deploy_functions:
        description: Deploy edge functions
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push migrations
        if: ${{ inputs.push_migrations }}
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy edge functions
        if: ${{ inputs.deploy_functions }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
