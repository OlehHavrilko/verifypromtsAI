    <script>
      // Static hosting (GitHub Pages) answers unknown paths with 404.html, which
      // forwards here as ?redirect=<path>. Restore the URL before React boots.
      (function () {
        var params = new URLSearchParams(location.search);
        var redirect = params.get("redirect");
        if (redirect && redirect.charAt(0) === "/") {
          params.delete("redirect");
          var qs = params.toString();
          history.replaceState(null, "", redirect + (qs ? "?" + qs : ""));
        }
      })();
    </script>
